env:
  id: "LunarLander-v3"
  continuous: false
  gravity: -10.0
  enable_wind: false
  wrapper: "naive_hover"
  bonus_weight: 1.0

ppo:
  policy: "MlpPolicy"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01

training:
  total_timesteps: 500000
  seed: 42
  log_dir: "logs/hacked"
  save_dir: "models/hacked"
  save_freq: 50000